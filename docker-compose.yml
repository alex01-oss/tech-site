services:
  nginx:
    container_name: nginx
    image: nginx:stable
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app-network

  frontend:
    container_name: frontend
    image: nextapp:1.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - NEXT_PUBLIC_API_URL=/api
    expose:
      - 3000
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - SERVER_API_URL=http://backend:8080/api/
    depends_on:
      - backend
    restart: always
    networks:
      - app-network
    env_file:
      - ./frontend/.env.production

  backend:
    container_name: backend
    image: fastapiapp:1.0.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - 8080
    env_file:
      - ./backend/.env.production
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - app-network


  redis:
    container_name: redis
    image: redis:latest
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    expose:
      - 6379
    restart: always
    networks:
      - app-network

  db:
    container_name: db
    image: postgres:17.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: fastapi_catalog
    volumes:
      - tech-site_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    expose:
      - 5432
    restart: always
    networks:
      - app-network

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always
    group_add:
      - "1001"

  pgadmin:
    container_name: pgadmin4
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "alexa.demochko@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - app-network

volumes:
  tech-site_pgdata:
    external: true
  redis-data:
    driver: local
  portainer_data:
    driver: local
  pgadmin-data:

networks:
  app-network:
    driver: bridge