version: "3.8"

services:
  nginx:
    container_name: nginx
    image: nginx:stable
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app-network

  frontend:
    container_name: frontend
    image: nextapp:1.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - NEXT_PUBLIC_API_URL=https://localhost:8443/api
    expose:
      - 3000
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://localhost:8443/api
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

  backend:
    container_name: backend
    image: fastapiapp:1.0.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - 8080
    environment:
      - DATABASE_URL=postgresql://postgres:admin@db:5432/fastapi_catalog
      - ITEMS_PER_PAGE=10
      - CACHE_TYPE=RedisCache
      - CACHE_REDIS_HOST=redis
      - CACHE_REDIS_PORT=6379
      - CACHE_REDIS_DB=0
      - PRODUCTION=true
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - app-network

  redis:
    container_name: redis
    image: redis:latest
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    expose:
      - 6379
    restart: always
    networks:
      - app-network

  db:
    container_name: db
    image: postgres:17.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: catalog
    volumes:
      - tech-site_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    expose:
      - 5432
    restart: always
    networks:
      - app-network

volumes:
  tech-site_pgdata:
    external: true
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge
